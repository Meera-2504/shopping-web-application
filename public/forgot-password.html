<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — KindredMade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEEAE0; --bg-alt: #E4DFD1; --ink: #23261F; --ink-soft: #5A5D51;
    --brick: #C1272D; --teal: #3B6E71; --mustard: #E8B54D; --card: #FBF9F4;
    --line: rgba(35,38,31,0.14); --radius: 4px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:'Work Sans', sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  h1{ font-family:'Fraunces', serif; margin:0; letter-spacing:-0.01em; }
  a{ color:inherit; }

  .card{
    width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:40px 36px;
  }
  .logo{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.3rem;
    display:inline-flex; gap:6px; text-decoration:none; margin-bottom:28px;
  }
  .logo span{ font-style:italic; color:var(--brick); }
  .eyebrow{
    font-family:'IBM Plex Mono'; font-size:0.75rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--teal); display:block; margin-bottom:12px;
  }
  h1{ font-size:1.7rem; font-weight:600; margin-bottom:10px; }
  .sub{ color:var(--ink-soft); font-size:0.92rem; margin-bottom:28px; line-height:1.5; }

  .field{ margin-bottom:20px; }
  .field label{ display:block; font-size:0.82rem; font-weight:500; margin-bottom:6px; }
  .field input{
    width:100%; padding:13px 14px; border:1px solid var(--ink);
    border-radius:var(--radius); background:var(--bg); font-family:'Work Sans';
    font-size:0.95rem; color:var(--ink);
  }
  .field input:focus-visible{ outline:2px solid var(--teal); outline-offset:1px; }
  .field-error{ display:none; color:var(--brick); font-size:0.78rem; margin-top:6px; }
  .field.invalid input{ border-color:var(--brick); }
  .field.invalid .field-error{ display:block; }

  .btn-primary{
    width:100%; padding:14px; border-radius:100px; border:1px solid var(--ink);
    background:var(--ink); color:var(--bg); font-size:0.95rem; font-weight:500;
    cursor:pointer; transition:transform .15s ease;
  }
  .btn-primary:hover{ transform:translateY(-2px); }
  .btn-primary:disabled{ opacity:0.6; cursor:default; transform:none; }

  .result-box{
    display:none; background:rgba(59,110,113,0.1); color:var(--teal);
    border:1px solid rgba(59,110,113,0.3); border-radius:var(--radius);
    padding:14px; font-size:0.88rem; margin-bottom:20px; line-height:1.5;
  }
  .result-box.show{ display:block; }
  .result-box.error{
    background:rgba(193,39,45,0.1); color:var(--brick); border-color:rgba(193,39,45,0.3);
  }

  .back-line{ text-align:center; margin-top:24px; font-size:0.88rem; color:var(--ink-soft); }
  .back-line a{ text-decoration:underline; text-underline-offset:2px; color:var(--brick); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<div class="card">
  <a href="index.html" class="logo">Kindred<span>Made</span></a>
  <span class="eyebrow">Account recovery</span>
  <h1>Forgot your password?</h1>
  <p class="sub">Enter the email on your account and we'll send you a link to set a new password.</p>

  <div id="result-box" class="result-box"></div>

  <form id="forgot-form" novalidate>
    <div class="field" id="email-field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@email.com" required>
      <span class="field-error">Enter a valid email address.</span>
    </div>
    <button type="submit" class="btn-primary">Send reset link</button>
  </form>

  <p class="back-line"><a href="login.html">&larr; Back to log in</a></p>
</div>

<script>
  const form = document.getElementById('forgot-form');
  const emailField = document.getElementById('email-field');
  const emailInput = document.getElementById('email');
  const resultBox = document.getElementById('result-box');
  const submitBtn = form.querySelector('button[type="submit"]');

  function validEmail(value){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  function showResult(msg, isError){
    resultBox.textContent = msg;
    resultBox.classList.add('show');
    resultBox.classList.toggle('error', !!isError);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    resultBox.classList.remove('show');

    if (!validEmail(emailInput.value)) {
      emailField.classList.add('invalid');
      return;
    }
    emailField.classList.remove('invalid');

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    try {
      const res = await fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: emailInput.value })
      });
      const data = await res.json();

      if (!res.ok) {
        showResult(data.error || 'Something went wrong. Try again.', true);
      } else {
        // No email service is connected yet, so during development the
        // reset link is printed to the server's terminal instead.
        showResult(data.message + ' (For now, check the server terminal for the link.)');
        form.reset();
      }
    } catch (err) {
      showResult('Could not reach the server. Is it running?', true);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send reset link';
    }
  });
</script>

</body>
</html>
